<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="data:," />
  <title>Block Duel WU04</title>
  <link rel="stylesheet" href="./src/styles.css?v=040" />
</head>
<body>
  <main id="app" class="app-shell">
    <header class="hud-top">
      <div class="stat"><span>점수</span><strong id="score">0</strong></div>
      <div class="timer"><strong id="time">00:00</strong><small id="mode-label">버튼</small></div>
      <button id="pause-btn" class="icon-button" aria-label="일시정지">Ⅱ</button>
    </header>

    <section class="preview-strip" aria-label="게임 정보">
      <button id="hold-btn" class="preview-box hold-box" aria-label="홀드">
        <span>HOLD</span>
        <canvas id="hold" width="72" height="52" aria-label="홀드 블록"></canvas>
      </button>

      <div class="preview-box next-box">
        <span>NEXT</span>
        <canvas id="next" width="210" height="52" aria-label="다음 블록 3개"></canvas>
      </div>

      <div class="mini-stats" aria-label="게임 통계">
        <span>라인 <b id="lines">0</b></span>
        <span>레벨 <b id="level">1</b></span>
        <span>B2B <b id="b2b">0</b></span>
      </div>
    </section>

    <section class="duel-strip" aria-label="로컬 봇 대전 정보">
  <div class="duel-score"><span>YOU</span><strong id="duel-score">0 : 0</strong><span>BOT</span></div>
  <div class="rival-panel">
    <canvas id="rival-board" width="100" height="200" aria-label="상대 미니 보드"></canvas>
    <div class="rival-meta">
      <span>상대 위험 <b id="rival-danger-value">0%</b></span>
      <div id="rival-danger" class="rival-danger"><i></i></div>
      <span>공격 준비 <b id="rival-pending">0</b></span>
    </div>
  </div>
  <label class="bot-level">BOT
    <select id="bot-difficulty">
      <option value="easy">초급</option>
      <option value="normal">중급</option>
      <option value="hard">고급</option>
    </select>
  </label>
</section>
<section id="game-stage" class="game-stage">
      <section id="board-wrap" class="board-wrap" aria-label="게임 보드">
        <canvas id="board" width="300" height="600"></canvas>
        <div id="combo-pop" class="combo-pop" aria-live="polite"></div>
        <div id="clear-flash" class="clear-flash" aria-hidden="true"></div>
        <div id="overlay" class="overlay hidden">
          <h1 id="overlay-title">일시정지</h1>
          <button id="resume-btn">계속</button>
          <button id="restart-btn">다시 시작</button>
        </div>
      </section>
    </section>

    <section id="controls" class="controls" aria-label="터치 조작">
      <button data-action="left" aria-label="왼쪽">◀</button>
      <button data-action="right" aria-label="오른쪽">▶</button>
      <button data-action="soft" aria-label="천천히 내리기">▼</button>
      <button data-action="rotate" aria-label="회전">↻</button>
      <button data-action="hard" aria-label="빠른 내리기">⇓</button>
    </section>

    <footer class="bottom-bar">
      <button id="mode-btn">스와이프 전환</button>
      <button id="settings-btn" class="settings-button" aria-label="조작 설정">조작 설정</button>
      <span id="hint">버튼 조작</span>
    </footer>

    <section id="settings-sheet" class="settings-sheet hidden" aria-label="조작 설정">
      <div class="settings-backdrop" data-close-settings></div>
      <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="settings-head">
          <h2 id="settings-title">조작 설정</h2>
          <button id="settings-close" aria-label="설정 닫기">✕</button>
        </div>
        <label>
          기본 조작
          <select id="mode-select">
            <option value="buttons">버튼 모드</option>
            <option value="swipe">스와이프 모드</option>
          </select>
        </label>
        <label>
          스와이프 민감도
          <select id="sensitivity-select">
            <option value="low">낮음</option>
            <option value="normal">보통</option>
            <option value="high">높음</option>
          </select>
        </label>
        <label class="switch-row"><span>효과음</span><input id="sound-toggle" type="checkbox" checked /></label>
        <label class="switch-row"><span id="haptic-label">진동</span><input id="haptic-toggle" type="checkbox" checked /></label>
        <label class="switch-row"><span>화면 흔들림</span><input id="shake-toggle" type="checkbox" checked /></label>
        <p id="platform-note" class="settings-note">효과음은 첫 터치 후 활성화돼.</p>
        <p class="settings-note">설정은 이 기기에 자동 저장돼.</p>
      </div>
    </section>
  </main>
  <script type="module" src="./src/main.js?v=040"></script>
  <script type="module" src="./src/battle-engine.js?v=040"></script>
</body>
</html>
